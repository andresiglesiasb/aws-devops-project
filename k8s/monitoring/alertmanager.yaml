apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      smtp_smarthost: 'smtp.gmail.com:587'
      smtp_from: 'yourmails@gmail.com'
      smtp_auth_username: 'yourmail@gmail.com'
      smtp_auth_password: '<APP_PASSWORD>'
      smtp_require_tls: true

    route:
      receiver: 'email-alertas'
      group_by: ['alertname', 'severity']
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 1h

    receivers:
      - name: 'email-alertas'
        email_configs:
          - to: 'yourmail@gmail.com'
            send_resolved: true
            headers:
              Subject: 'Alerta K8s: {{ .CommonLabels.alertname }}'
            text: |
              {{ range .Alerts }}
              Alerta:      {{ .Labels.alertname }}
              Severidad:   {{ .Labels.severity }}
              Descripcion: {{ .Annotations.summary }}
              Estado:      {{ .Status }}
              {{ end }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"
          ports:
            - containerPort: 9093
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: storage
              mountPath: /alertmanager
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: storage
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  selector:
    app: alertmanager
  ports:
    - port: 9093
      targetPort: 9093
  type: ClusterIP
