name: Terraform CI

on:
  push:
    branches: [main]
    paths: ["aws-infra/**", ".github/workflows/terraform.yml"]
  pull_request:
    paths: ["aws-infra/**", ".github/workflows/terraform.yml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aws-infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: terraform fmt
        run: terraform fmt -check -recursive

      # No backend and no credentials: validate needs neither AWS nor state.
      - name: terraform init
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

      - uses: terraform-linters/setup-tflint@v4

      - name: tflint
        run: |
          tflint --init
          tflint --recursive

      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: aws-infra
          framework: terraform
          soft_fail: true # lab environment: report findings without blocking
